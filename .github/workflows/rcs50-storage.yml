name: RCS-50 — stockage POC
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rcs50:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-rcs50.txt
      - run: python -m pytest -q tests/test_rcs50_storage.py
