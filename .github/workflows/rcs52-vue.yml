name: RCS-52 — vue mesures et anomalies
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rcs52:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-rcs52.txt
      - run: python scripts/download_ai4i.py
      - run: python -m pytest -q tests/test_rcs52_dashboard.py
