name: RCS-17 — vérification de préparation Sprint 0
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  sprint-readiness:
    name: Vérifier la capacité sans lancer Jira
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_rcs17_sprint0.py' -v
      - run: python -m tools.rcs17_sprint0 --capacity planning/rcs17_capacity.csv
