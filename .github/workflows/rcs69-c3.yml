name: RCS-69 — préparation C3 sans preuve diffusion fictive
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  c3:
    name: Vérifier cas candidats et baseline artificielle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_rcs69_c3.py' -v
      - run: python -m tools.rcs69_case_audit --cases planning/rcs69_cases_proposed.csv
      - run: python -m experiments.rcs69_synthetic_baseline
