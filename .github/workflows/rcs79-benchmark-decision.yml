name: RCS-79 décision benchmark V2

on:
  push:
    paths:
      - "tools/rcs79_benchmark_decision.py"
      - "tests/test_rcs79_benchmark_decision.py"
      - "governance/rcs79/**"
      - "docs/48_rcs79_benchmark_decision.md"
      - "tools/rcs81_evaluate.py"
      - "planning/rcs81_case_manifest.csv"
      - ".github/workflows/rcs79-benchmark-decision.yml"
  pull_request:
    paths:
      - "tools/rcs79_benchmark_decision.py"
      - "tests/test_rcs79_benchmark_decision.py"
      - "governance/rcs79/**"
      - "docs/48_rcs79_benchmark_decision.md"
      - "tools/rcs81_evaluate.py"
      - "planning/rcs81_case_manifest.csv"

jobs:
  benchmark-decision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Vérifier les portes GO/NO-GO et l'absence de résultat simulé
        run: python -m unittest tests.test_rcs79_benchmark_decision -v
      - name: Contrôler le rapport livré (NO_GO sans preuve réelle)
        run: python -m tools.rcs79_benchmark_decision --check
