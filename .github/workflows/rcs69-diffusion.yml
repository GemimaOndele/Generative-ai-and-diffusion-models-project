name: RCS-69 — DDPM entraîné sur données synthétiques
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  synthetic-diffusion:
    name: Entraînement NumPy, tests et rapport SYNTHÉTIQUE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-rcs69.txt
      - run: python -m unittest discover -s tests -p 'test_rcs69_diffusion.py' -v
      - run: python -m experiments.rcs69_diffusion_numpy --seed 42 --updates 250 --json artifacts/rcs69_synthetic_poc.json
      - uses: actions/upload-artifact@v4
        with:
          name: RCS69-SYNTHETIC-ONLY-diffusion-report
          path: artifacts/rcs69_synthetic_poc.json
          retention-days: 14
