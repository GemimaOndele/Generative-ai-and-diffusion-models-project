name: RCS-38 — UI monitoring quatre volets
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ui-contract:
    name: Vérifier UI fictive, données et JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -p 'test_rcs38_monitoring.py' -v
      - run: python -m tools.rcs38_contract
      - run: node --check frontend/monitoring/app.js
      - run: node --test tests/test_rcs38_frontend.cjs
