name: RCS — vérification préparation Pages
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  page-preview:
    name: Contrôle des fichiers du site statique
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_pages_readiness.py' -v
      - run: echo "Seuls les SVG du README et la source gh-pages sont contrôlés. Aucun site n’est publié depuis main/docs."
