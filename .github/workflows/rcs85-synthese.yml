name: RCS-85 synthèse TP05

on:
  push:
    paths:
      - "tools/rcs85_synthese_tp05.py"
      - "tests/test_rcs85_synthese_tp05.py"
      - "governance/rcs85/**"
      - "docs/49_rcs85_synthese_tp05.md"
      - "experiments/results/tp05_mesures.csv"
      - "docs/06_tp05_finops_green_ethique.md"
      - ".github/workflows/rcs85-synthese.yml"
  pull_request:
    paths:
      - "tools/rcs85_synthese_tp05.py"
      - "tests/test_rcs85_synthese_tp05.py"
      - "governance/rcs85/**"
      - "docs/49_rcs85_synthese_tp05.md"
      - "experiments/results/tp05_mesures.csv"
      - "docs/06_tp05_finops_green_ethique.md"

jobs:
  tp05-synthesis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Contrôler coût/succès, émissions, risques et décision
        run: python -m unittest tests.test_rcs85_synthese_tp05 -v
      - name: Vérifier la synthèse livrée (À TESTER sans mesures)
        run: python -m tools.rcs85_synthese_tp05 --check
