name: RCS-25 — fiches AI4I / MIMII DUE
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rcs25:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-rcs25.txt
      - run: python -m pytest -q tests/test_rcs25_fiches.py
