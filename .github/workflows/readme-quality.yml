name: RCS — qualité du README et visuels
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  readme:
    name: Vérifier README, assets SVG et audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_readme_quality.py' -v
      - run: echo "Contrôle du contenu et des assets ; il ne prouve ni performance IA ni animation dans tous les navigateurs."
