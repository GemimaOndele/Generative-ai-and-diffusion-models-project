name: RCS-77 — mono-A / mono-B / routing / cascade
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rcs77:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-rcs77.txt
      - run: python run_benchmark.py --mode demo --out artifacts/tp04_demo
      - run: python -m pytest -q tests/test_rcs77_orchestrator.py
