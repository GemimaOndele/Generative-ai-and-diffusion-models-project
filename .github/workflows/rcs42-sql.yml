name: RCS-42 — MLD et SQL
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rcs42:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-rcs42.txt
      - run: python -m pytest -q tests/test_rcs42_sql.py
