name: RCS-39 — cohérence documentaire HITL
on:
  pull_request:
    paths:
      - 'tests/test_rcs39_automation_rules.py'
      - 'docs/**'
      - 'data/contracts/**'
      - '.github/workflows/**'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.5
      - run: python -m pytest -q tests/test_rcs39_automation_rules.py
