name: RCS-90 — contrôles FinOps
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  cost-tests:
    name: Vérifier calculateur FinOps et absence de chiffres inventés
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test Python standard library
        run: python -m unittest discover -s tests -p 'test_rcs90_finops.py' -v
      - name: Vérifier des CSV vides
        run: python -m tools.rcs90_finops --costs planning/rcs90_costs.csv --worklogs planning/rcs90_worklogs.csv
