name: RCS-24 — fiche AccessGUDID
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rcs24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-rcs24.txt
      - run: python -m pytest -q tests/test_rcs24_fiche.py
