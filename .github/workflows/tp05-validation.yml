name: RCS — syntaxe et utilitaires TP05
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tp05:
    name: Vérifier la lecture CodeCarbon et le schéma CSV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -p 'test_tp05_codecarbon.py' -v
      - run: echo "Aucune exécution CodeCarbon instrumentée, aucun résultat environnemental validé"
