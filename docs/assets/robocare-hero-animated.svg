<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="RoboCare Sentinel — paysage futuriste de surveillance biomédicale, machine stylisée en perspective et impulsions de données animées">
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#06172c"/><stop offset=".52" stop-color="#0b2b45"/><stop offset="1" stop-color="#10314a"/></linearGradient>
    <linearGradient id="steel" x1="0" x2="1" y2="1"><stop stop-color="#d8e8f1"/><stop offset=".42" stop-color="#8eafbf"/><stop offset="1" stop-color="#3d647d"/></linearGradient>
    <linearGradient id="steelTop" x2="1" y2="1"><stop stop-color="#eaf4f5"/><stop offset="1" stop-color="#7faabf"/></linearGradient>
    <linearGradient id="blockSide" x1="0" x2="1" y2="1"><stop stop-color="#7398ac"/><stop offset="1" stop-color="#1e465f"/></linearGradient>
    <linearGradient id="glow" x2="1"><stop stop-color="#15d7c5" stop-opacity=".2"/><stop offset=".55" stop-color="#72f5fa" stop-opacity=".95"/><stop offset="1" stop-color="#10a9bb" stop-opacity=".3"/></linearGradient>
    <radialGradient id="aura"><stop stop-color="#22d7dc" stop-opacity=".36"/><stop offset="1" stop-color="#22d7dc" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="skewX(-30) scale(1,.6)">
      <path d="M40 0H0V40" fill="none" stroke="#28718b" stroke-width=".65" opacity=".36"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="15"/></filter>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#030d19" flood-opacity=".6"/></filter>
  </defs>
  <rect width="1200" height="430" rx="24" fill="url(#bg)"/>
  <path d="M0 275 L1200 275 1200 430 0 430Z" fill="url(#grid)" opacity=".8"/>
  <circle cx="845" cy="226" r="265" fill="url(#aura)"><animate attributeName="opacity" values=".45;.9;.45" dur="5s" repeatCount="indefinite"/></circle>
  <path d="M0 350H435 L485 324 L600 324" stroke="#2cc6d5" stroke-width="2" fill="none" opacity=".55"/>
  <path d="M1200 349H1090 L1047 324 H1005" stroke="#2cc6d5" stroke-width="2" fill="none" opacity=".55"/>
  <circle r="5" fill="#68f9e9"><animateMotion dur="6s" repeatCount="indefinite" path="M0 350H435 L485 324 L600 324"/></circle>
  <circle r="4" fill="#8beefd"><animateMotion dur="7s" repeatCount="indefinite" path="M1200 349H1090 L1047 324 H1005"/></circle>

  <g transform="translate(65 94)">
    <rect x="0" y="0" width="90" height="5" rx="2" fill="#40eadc"/>
    <text x="0" y="35" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="5" font-weight="700" fill="#62eced">PROJECT • ECE PARIS</text>
    <text x="0" y="110" font-family="Arial, Helvetica, sans-serif" font-size="55" font-weight="800" fill="#effaff">ROBOCARE</text>
    <text x="0" y="169" font-family="Arial, Helvetica, sans-serif" font-size="55" font-weight="800" fill="#86f3e5">SENTINEL</text>
    <text x="1" y="205" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#bcdae4">Medical equipment · AI-assisted maintenance</text>
    <text x="1" y="232" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#8eb6c8">Diffusion  ·  Multi-LLM  ·  Green AI  ·  Human oversight</text>
    <rect x="0" y="265" width="214" height="38" rx="19" fill="#0b4955" stroke="#35d9ca" stroke-opacity=".8"/>
    <circle cx="19" cy="284" r="5" fill="#46e8c6"><animate attributeName="opacity" values="1;.35;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <text x="35" y="290" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#c4fffa">RESEARCH PROTOTYPE</text>
  </g>

  <g transform="translate(820 253)">
    <ellipse rx="240" ry="78" fill="#041524" opacity=".5" filter="url(#blur)"/>
    <ellipse rx="210" ry="71" fill="none" stroke="#20c2d0" stroke-width="2" opacity=".5"/>
    <ellipse rx="174" ry="57" fill="none" stroke="#3affde" stroke-width="7" stroke-dasharray="85 32" opacity=".85">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="18s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="207" ry="70" fill="none" stroke="#66f8f0" stroke-width="3" stroke-dasharray="2 30" opacity=".65">
      <animateTransform attributeName="transform" type="rotate" values="360;0" dur="25s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="139" ry="47" fill="#12566b" opacity=".36"/>
  </g>

  <!-- Isometric 3D-style machine: deliberately symbolic, no real equipment model. -->
  <g transform="translate(731 83)" filter="url(#drop)">
    <ellipse cx="87" cy="243" rx="115" ry="30" fill="#06283a" opacity=".7"/>
    <path d="M-12 186L115 155 205 188 76 223Z" fill="url(#steelTop)" stroke="#b5ecf0"/>
    <path d="M76 223L205 188 205 226 76 261Z" fill="url(#blockSide)" stroke="#61b6c7"/>
    <path d="M-12 186L76 223 76 261 -12 222Z" fill="#7297ad" stroke="#a7d9e0"/>
    <path d="M-5 184L110 158 200 189 78 220Z" fill="#274f66"/>
    <path d="M22 184L111 166 174 188 82 209Z" fill="#77e3e1" opacity=".2"/>
    <path d="M-11 188L77 223" stroke="#44f4ec" stroke-width="3" opacity=".7"/>
    <path d="M76 223L202 187" stroke="#44f4ec" stroke-width="3" opacity=".7"/>
    <!-- scanner arch -->
    <path d="M1 175V70Q1 30 46 18L103 5Q142 -3 155 30L158 56 126 66 125 40Q124 28 112 32L64 44Q43 49 43 67V168Z" fill="url(#steel)" stroke="#e9f9ff" stroke-width="2"/>
    <path d="M43 68L61 61V158L43 168Z" fill="#1b6580" opacity=".85"/>
    <path d="M126 65L158 56V149L128 158Z" fill="#214a66"/>
    <path d="M1 76L43 69" stroke="#5af5f0" stroke-width="3"/>
    <path d="M124 73L157 63" stroke="#5af5f0" stroke-width="3"/>
    <path d="M1 169L42 164" stroke="#1d4058" stroke-width="5"/>
    <rect x="48" y="86" width="83" height="79" rx="23" fill="#00304b" stroke="#4cdae8" stroke-width="4" transform="skewY(-8)"/>
    <circle cx="88" cy="118" r="28" fill="none" stroke="#3af6e1" stroke-width="1.5" opacity=".7">
      <animate attributeName="r" values="20;27;20" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".2;.85;.2" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <path d="M57 113H118" stroke="#51ecec" stroke-width="1.6" opacity=".65">
      <animate attributeName="stroke-dasharray" values="5 50;35 10;5 50" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>

  <g fill="#0b3348" stroke="#2edce9" stroke-opacity=".82">
    <rect x="1020" y="90" width="132" height="87" rx="13"/>
    <rect x="1003" y="200" width="149" height="72" rx="13"/>
    <rect x="572" y="80" width="104" height="86" rx="13"/>
  </g>
  <g fill="none" stroke="#5bf2dd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1037 147L1054 132 1072 140 1093 114 1113 125 1135 105" stroke-dasharray="120" opacity=".9"/>
    <path d="M1025 233H1042L1050 222L1063 251 1074 216 1083 235H1132" opacity=".92"/>
    <path d="M595 142L614 126 626 136 643 112 658 124" opacity=".9"/>
  </g>
  <g fill="#81fef0">
    <circle cx="1135" cy="105" r="4"><animate attributeName="opacity" values=".3;1;.3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1074" cy="216" r="4"><animate attributeName="opacity" values="1;.3;1" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="643" cy="112" r="4"><animate attributeName="opacity" values=".2;1;.2" dur="4s" repeatCount="indefinite"/></circle>
  </g>
  <text x="605" y="190" font-family="Arial,Helvetica,sans-serif" font-size="10" letter-spacing="2" fill="#7aa8b4">SIGNAL</text>
  <text x="1024" y="299" font-family="Arial,Helvetica,sans-serif" font-size="10" letter-spacing="2" fill="#7aa8b4">MONITORING</text>
  <rect x="1" y="1" width="1198" height="428" rx="23" stroke="#4f8097" stroke-opacity=".4" stroke-width="2" fill="none"/>
</svg>